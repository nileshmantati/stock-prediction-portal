# ═══════════════════════════════════════════════════════════════
#  Stock Prediction Portal — Production Docker Compose
#  Usage: docker compose up --build
# ═══════════════════════════════════════════════════════════════

services:

  # ── Django REST Backend ──────────────────────────────────────
  backend:
    build:
      context: ./backend
      target: production
    container_name: stockvision_backend
    env_file:
      - ./backend/.env
    environment:
      # Override for Docker networking
      - ALLOWED_HOSTS=localhost,127.0.0.1,backend
      - CORS_ALLOWED_ORIGINS=http://localhost,http://127.0.0.1
    volumes:
      # Persist generated prediction plot images across restarts
      - media_data:/app/media
      # Persist the SQLite database (swap for Postgres in real prod)
      - db_data:/app/db
    expose:
      - "8000"          # Internal only — nginx proxies to it
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/admin/login/')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # ── React Frontend (Nginx) ───────────────────────────────────
  frontend:
    build:
      context: ./frontend-react
      target: production
      args:
        # Relative paths — nginx proxies /api/ and /media/ to backend
        VITE_BACKEND_BASE_API: /api/v1
        VITE_BACKEND_ROOT: ""
    container_name: stockvision_frontend
    ports:
      - "80:80"           # Access at http://localhost
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

# ── Named Volumes ────────────────────────────────────────────
volumes:
  media_data:
    name: stockvision_media
  db_data:
    name: stockvision_db
