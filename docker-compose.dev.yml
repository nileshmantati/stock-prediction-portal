# ═══════════════════════════════════════════════════════════════
#  Stock Prediction Portal — Development Docker Compose
#  Features: hot-reload for both frontend and backend
#  Usage: docker compose -f docker-compose.dev.yml up --build
# ═══════════════════════════════════════════════════════════════

services:

  # ── Django Dev Server ────────────────────────────────────────
  backend:
    build:
      context: ./backend
      target: base          # Only install deps, no collectstatic
    container_name: stockvision_backend_dev
    env_file:
      - ./backend/.env
    environment:
      - ALLOWED_HOSTS=localhost,127.0.0.1,backend,0.0.0.0
      - CORS_ALLOWED_ORIGINS=http://localhost:5173,http://localhost
    volumes:
      - ./backend:/app      # Mount source for hot-reload
      - media_data:/app/media
    ports:
      - "8000:8000"         # Exposed directly for Vite dev proxy
    command: >
      sh -c "python manage.py migrate &&
             python manage.py runserver 0.0.0.0:8000"
    restart: unless-stopped

  # ── Vite Dev Server ──────────────────────────────────────────
  frontend:
    image: node:20-alpine
    container_name: stockvision_frontend_dev
    working_dir: /app
    volumes:
      - ./frontend-react:/app       # Mount source for HMR
      - /app/node_modules           # Anonymous volume prevents host node_modules override
    ports:
      - "5173:5173"                 # Access at http://localhost:5173
    environment:
      - VITE_BACKEND_BASE_API=http://localhost:8000/api/v1
      - VITE_BACKEND_ROOT=http://localhost:8000
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  media_data:
    name: stockvision_media_dev
