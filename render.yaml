services:
  - type: web
    name: django-backend
    env: python
    rootDir: backend
    buildCommand: "bash build.sh"
    startCommand: "gunicorn predictions_portal.wsgi:application"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: django-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: ".onrender.com,localhost,127.0.0.1"
      - key: CORS_ALLOWED_ORIGINS
        # Update this to your Vercel frontend URL once deployed
        value: "http://localhost:5173,http://localhost"

databases:
  - name: django-db
    databaseName: predictions_db
    user: django
